<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>StockNest — Campus Supply Ledger</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Sora:wght@300;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="bgbin"></div>
<div class="bg"><i class="l"></i><i class="r"></i><b></b></div>

<button type="button" class="ghost theme-toggle" id="loginThemeToggle" role="switch" aria-checked="true" aria-label="Switch to light mode" title="Switch to light mode"></button>
<main id="login"><div class="card" id="card"></div></main>

<div id="app" class="app-shell">
 <aside class="sidebar" aria-label="Main navigation">
  <div class="sidebar-nav"><div class="sidebar-section-title">Workspace</div><nav id="nav"></nav></div>
  <div class="sidebar-bottom">
   <details class="profile-menu" id="profileMenu">
    <summary class="profile-button" id="profileToggle" aria-label="Open profile menu"><span class="profile-avatar" id="profileAvatar">?</span><span id="profileButtonName">Create profile</span><span class="profile-chevron" aria-hidden="true">⌃</span></summary>
    <div class="profile-menu-pop">
     <div class="profile-menu-brand"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 15.5 24 7l17 8.5v21L24 45 7 36.5v-21Z"/><path d="m7 15.5 17 9 17-9M24 25v20M15 11l17 9M16 29v7m6-8v10m6-10v9m6-11v8"/></svg></span><span><strong>StockNest</strong><small>Campus Supply Ledger</small></span></div>
     <button type="button" class="ghost" id="aboutProfile">About us</button><button type="button" class="ghost" id="editProfile">Edit profile</button><button type="button" class="ghost signout-button" id="out">Sign out</button>
    </div>
   </details>
  </div>
 </aside>
 <main class="app-main">
  <header class="topbar"><h2>Inventory dashboard</h2><button type="button" class="ghost theme-toggle" id="themeToggle" role="switch" aria-checked="true" aria-label="Switch to light mode" title="Switch to light mode"></button></header>
  <section id="view"></section>
 </main>
</div>
<dialog id="productEditDialog" class="product-edit-dialog" aria-labelledby="productEditTitle">
 <h2 id="productEditTitle">Edit product</h2>
 <p>Update the product name and stock limits.</p>
 <label for="editProductSku">SKU</label><input id="editProductSku" readonly>
 <label for="editProductName">Name</label><input id="editProductName" maxlength="100">
 <div class="row2">
  <div><label for="editProductThreshold">Minimum threshold</label><input id="editProductThreshold" type="number" min="0" step="1"></div>
  <div><label for="editProductTarget">Target stock</label><input id="editProductTarget" type="number" min="1" step="1"></div>
 </div>
 <div class="err" id="productEditError" role="alert"></div>
 <div class="product-edit-actions"><button type="button" class="ghost" id="cancelProductEdit">Cancel</button><button type="button" class="primary" id="saveProductEdit">Save changes</button></div>
</dialog>
<dialog id="profileDialog" aria-labelledby="profileTitle">
 <form id="profileForm">
  <h2 id="profileTitle">Owner profile</h2>
  <p class="profile-help">Your profile is saved in this browser.</p>
  <div class="profile-preview" id="profilePreview" aria-label="Profile photo preview"></div>
  <label for="profilePhoto">Profile photo</label><input id="profilePhoto" type="file" accept="image/jpeg,image/png,image/webp">
  <button type="button" class="ghost remove-photo" id="removeProfilePhoto">Remove photo</button>
  <label for="ownerName">Name</label><input id="ownerName" maxlength="60" autocomplete="name" required>
  <label for="ownerRole">Role</label><input id="ownerRole" maxlength="60" value="Owner" autocomplete="organization-title">
  <label for="ownerQuestion">Recovery question</label><select id="ownerQuestion"><option value="">No recovery question</option></select>
  <label for="ownerAnswer">Recovery answer</label><input id="ownerAnswer" autocomplete="off" placeholder="Leave blank to keep the current answer">
  <div class="err" id="profileError" role="alert"></div>
  <div class="dialog-actions"><button type="button" class="ghost" id="cancelProfile">Cancel</button><button type="submit" class="primary">Save profile</button></div>
 </form>
</dialog><div id="toast" role="status"></div>

<script src="app.js" defer></script>
</body>
</html>
